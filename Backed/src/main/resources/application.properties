spring.application.name=carpool-app

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/carpool_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Osmani@143}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

# Seat hold duration (minutes)
app.seat.hold-minutes=10

# SMS provider config
# Choose provider via env: TWILIO, MSG91, FAST2SMS
sms.provider=${SMS_PROVIDER:MOCK}
sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
sms.twilio.from-number=${TWILIO_FROM_NUMBER:}
sms.msg91.auth-key=${MSG91_AUTH_KEY:}
sms.msg91.template-id=${MSG91_TEMPLATE_ID:}
sms.fast2sms.api-key=${FAST2SMS_API_KEY:}
sms.fast2sms.otp-id=${FAST2SMS_OTP_ID:}
APP_JWT_SECRET=carpool-super-secret-key-change-this-123456789
